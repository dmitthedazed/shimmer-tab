# On a published GitHub release: build the extension, attach the zip to the release,
# upload it to the Chrome Web Store and submit it for review, then refresh GitHub Pages.
# Secrets: CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_EXTENSION_ID, CWS_PUBLISHER_ID
# (see https://github.com/fregante/chrome-webstore-upload-keys).
name: Release

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: helium-newtab
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: helium-newtab/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile

            - name: Build extension
              run: |
                  pnpm build
                  version=$(node -p "require('./package.json').version")
                  echo "ZIP=shimmer-tab-$version.zip" >> "$GITHUB_ENV"
                  (cd dist && zip -qr "../shimmer-tab-$version.zip" .)

            - name: Attach zip to the release
              if: github.event_name == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber

            - name: Chrome Web Store
              env:
                  EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
                  PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
                  CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
              run: npx -y chrome-webstore-upload-cli@4.0.2 --source "$ZIP"

            - name: GitHub Pages
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
                  git fetch -q origin gh-pages:gh-pages || true
                  sh scripts/deploy-pages.sh --push
